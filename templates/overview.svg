<svg width="360" height="210" xmlns="http://www.w3.org/2000/svg">
<style>
svg {
  font-family: -apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif, Apple Color Emoji, Segoe UI Emoji;
  font-size: 14px;
  line-height: 21px;
}
#background {
  width: calc(100% - 10px);
  height: calc(100% - 10px);
  fill: black;
  stroke: rgb(225, 228, 232);
  stroke-width: 1px;
  rx: 6px;
  ry: 6px;
}
text {
  fill: white;
}
</style>
<g transform="translate(5, 5)">
<rect id="background" />
<g transform="translate(16, 16)">
<text x="0" y="15" font-weight="600" font-size="16">Overview</text>
<text x="0" y="45">⭐ Total Stars: {{ stargazers }}</text>
<text x="0" y="70">🍴 Total Forks: {{ forks }}</text>
<text x="0" y="95"> contributions: {{ contributions }}</text>
</g>
</g>
</svg>